<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      color: #e2e8f0;
    }
    .hero {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #646cff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.75rem;
    }
    p {
      color: #94a3b8;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Manicka Vasan</h1>
    <p>Full Stack Developer · Hamilton, NZ</p>
    <p style="margin-top:2rem;font-size:0.9rem;color:#475569;">↘ Click NEXUS to chat</p>
  </div>

  <link rel="stylesheet" href="/nexus.css">
  <script src="/nexus-magnet.js" defer></script>
  <script src="/nexus.js" defer></script>
</body>
</html>
